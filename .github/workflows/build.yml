name: Build Android APK

# 수동 실행 또는 코드 푸시 시 자동 빌드
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # GitHub 웹에서 수동 실행 버튼

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시스템 패키지 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential \
            libltdl-dev

      - name: Buildozer 및 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.33

      # 캐시 완전 비활성화: 불완전한 SDK/NDK 캐시가 복원되어
      # sdkmanager 없음 오류로 빌드가 조기 종료되던 문제 방지.
      # 매번 깨끗하게 전체 다운로드+빌드 (느리지만 확실).
      - name: 이전 buildozer 흔적 제거
        run: |
          rm -rf ~/.buildozer .buildozer 2>/dev/null || true
          echo "깨끗한 상태에서 시작"

      - name: buildozer용 Android SDK 준비 (sdkmanager 경로 수정)
        run: |
          set -e
          SDK_ROOT=~/.buildozer/android/platform/android-sdk
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          # 최신 cmdline-tools 다운로드
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d cmdtools_extract
          mv cmdtools_extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          # buildozer가 찾는 구식 경로(tools/bin/sdkmanager)에 심볼릭 링크
          mkdir -p "$SDK_ROOT/tools/bin"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$SDK_ROOT/tools/bin/avdmanager"
          echo "sdkmanager 위치:"
          ls -la "$SDK_ROOT/tools/bin/" "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # 라이선스 동의
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          echo "✅ SDK 준비 완료"

      - name: Android SDK 라이선스 사전 동의
        run: |
          # buildozer가 SDK 다운로드 시 라이선스 프롬프트에서 멈추지 않도록 미리 동의
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses || true
          # 알려진 라이선스 해시들 기록 (sdkmanager --licenses 대체)
          SDK_LIC=~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p "$SDK_LIC"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_LIC/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_LIC/android-sdk-preview-license"
          echo "라이선스 사전 동의 완료"

      - name: APK 빌드
        run: |
          # yes로 모든 프롬프트 자동 동의. 파이프라인 끝단 tee가 성공하면 스텝 통과.
          # (yes의 SIGPIPE는 set +o pipefail 상태에선 스텝을 죽이지 않음)
          set +o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log
          echo "빌드 스텝 종료"

      - name: APK 수집 및 성공 판정
        id: check
        if: always()
        run: |
          mkdir -p apk_out
          echo "=== bin/ 디렉토리 내용 ==="
          ls -la bin/ 2>/dev/null || echo "bin/ 없음"
          echo "=== 워크스페이스 전체 APK 검색 ==="
          # 작업 디렉토리 내 모든 apk (권한 문제 없는 범위)
          FOUND=$(find . -name "*.apk" 2>/dev/null)
          echo "$FOUND"
          # 전부 복사
          echo "$FOUND" | while read -r f; do
            [ -f "$f" ] && cp -f "$f" apk_out/ 2>/dev/null && echo "복사됨: $f"
          done
          echo "=== apk_out 결과 ==="
          ls -lh apk_out/ 2>/dev/null
          # 판정
          if ls apk_out/*.apk >/dev/null 2>&1; then
            echo "apk_exists=true" >> $GITHUB_OUTPUT
            echo "✅ APK 확보 성공"
          else
            echo "apk_exists=false" >> $GITHUB_OUTPUT
            echo "❌ APK 없음"
            exit 1
          fi

      - name: APK 업로드 (다운로드 가능)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CL-BusinessCard-APK
          path: apk_out/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: APK를 Release로 발행 (폰에서 직접 다운로드)
        if: always() && steps.check.outputs.apk_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls apk_out/*.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            # 보기 좋은 이름으로 복사
            cp "$APK" apk_out/CL-BusinessCard.apk
            TAG="v1.0-build${{ github.run_number }}"
            gh release create "$TAG" apk_out/CL-BusinessCard.apk \
              --title "CL Business Card 명함집 APK" \
              --notes "폰에서 아래 CL-BusinessCard.apk 를 눌러 다운로드 후 설치하세요." \
              || gh release upload "$TAG" apk_out/CL-BusinessCard.apk --clobber
            echo "✅ Release 발행 완료: $TAG"
          fi

      - name: 빌드 로그를 Issue로 전송 (디버깅용)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 에러 라인 + 마지막 100줄 추출
          {
            echo "## 빌드 실패 로그"
            echo '### ERROR/Exception 라인'
            echo '```'
            grep -niE "error|exception|traceback|failed|fatal|command failed|aidl|sdkmanager|no module|not found|cython|recipe" build.log 2>/dev/null | tail -50 || echo "(에러 라인 없음)"
            echo '```'
            echo '### build.log 마지막 120줄'
            echo '```'
            tail -120 build.log 2>/dev/null || echo "(build.log 없음)"
            echo '```'
          } > issue_body.md
          gh issue create --title "빌드 로그 $(date +%H%M)" --body-file issue_body.md 2>&1 || \
            gh issue comment 1 --body-file issue_body.md 2>&1 || \
            echo "Issue 전송 실패"

      - name: 빌드 로그 업로드 (아티팩트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
