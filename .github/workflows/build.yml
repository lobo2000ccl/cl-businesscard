name: Build Android APK

# 수동 실행 또는 코드 푸시 시 자동 빌드
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # GitHub 웹에서 수동 실행 버튼

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시스템 패키지 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential \
            libltdl-dev

      - name: Buildozer 및 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer
          pip install "cython>=3.0,<3.1"

      - name: Buildozer 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v2-

      - name: APK 빌드
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: APK 파일 찾아서 모으기
        run: |
          mkdir -p apk_out
          echo "=== 전체 APK 검색 ==="
          find / -name "*.apk" -not -path "*/.buildozer/android/platform/*" 2>/dev/null | tee apk_list.txt
          # 찾은 APK 전부 apk_out으로 복사
          while read -r f; do
            [ -f "$f" ] && cp "$f" apk_out/ && echo "복사: $f"
          done < apk_list.txt
          echo "=== apk_out 내용 ==="
          ls -lh apk_out/ || echo "APK 없음"
          # 빌드 로그 마지막 50줄 출력 (실패 원인 확인용)
          echo "=== build.log 마지막 60줄 ==="
          tail -60 build.log 2>/dev/null || true

      - name: APK 업로드 (다운로드 가능)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CL-BusinessCard-APK
          path: apk_out/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 빌드 로그를 Issue로 전송 (디버깅용)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 에러 라인 + 마지막 100줄 추출
          {
            echo "## 빌드 실패 로그"
            echo '### ERROR/Exception 라인'
            echo '```'
            grep -niE "error|exception|traceback|failed|fatal|command failed|aidl|sdkmanager|no module|not found|cython|recipe" build.log 2>/dev/null | tail -50 || echo "(에러 라인 없음)"
            echo '```'
            echo '### build.log 마지막 120줄'
            echo '```'
            tail -120 build.log 2>/dev/null || echo "(build.log 없음)"
            echo '```'
          } > issue_body.md
          gh issue create --title "빌드 로그 $(date +%H%M)" --body-file issue_body.md 2>&1 || \
            gh issue comment 1 --body-file issue_body.md 2>&1 || \
            echo "Issue 전송 실패"

      - name: 빌드 로그 업로드 (아티팩트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
