name: Build Android APK

# 수동 실행 또는 코드 푸시 시 자동 빌드
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # GitHub 웹에서 수동 실행 버튼

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시스템 패키지 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential \
            libltdl-dev

      - name: Buildozer 및 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.33

      - name: Buildozer 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v3-

      - name: APK 빌드
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: APK 파일 찾아서 모으기
        if: always()
        run: |
          mkdir -p apk_out
          echo "=== bin/ 폴더 APK ==="
          # buildozer는 bin/ 에 최종 APK를 둠. 없으면 dists에서 찾기
          cp bin/*.apk apk_out/ 2>/dev/null && echo "bin/에서 복사됨" || echo "bin/에 없음"
          # 혹시 bin에 없으면 빌드 산출물 경로에서 찾기 (접근가능 범위만)
          if [ -z "$(ls -A apk_out 2>/dev/null)" ]; then
            find .buildozer -name "*-debug*.apk" 2>/dev/null | while read -r f; do
              cp "$f" apk_out/ && echo "복사: $f"
            done
          fi
          echo "=== apk_out 최종 내용 ==="
          ls -lh apk_out/ 2>/dev/null || echo "APK 없음"

      - name: APK 업로드 (다운로드 가능)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CL-BusinessCard-APK
          path: apk_out/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: APK를 Release로 발행 (폰에서 직접 다운로드)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls apk_out/*.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            # 보기 좋은 이름으로 복사
            cp "$APK" apk_out/CL-BusinessCard.apk
            TAG="v1.0-build${{ github.run_number }}"
            gh release create "$TAG" apk_out/CL-BusinessCard.apk \
              --title "CL Business Card 명함집 APK" \
              --notes "폰에서 아래 CL-BusinessCard.apk 를 눌러 다운로드 후 설치하세요." \
              || gh release upload "$TAG" apk_out/CL-BusinessCard.apk --clobber
            echo "✅ Release 발행 완료: $TAG"
          fi

      - name: 빌드 로그를 Issue로 전송 (디버깅용)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 에러 라인 + 마지막 100줄 추출
          {
            echo "## 빌드 실패 로그"
            echo '### ERROR/Exception 라인'
            echo '```'
            grep -niE "error|exception|traceback|failed|fatal|command failed|aidl|sdkmanager|no module|not found|cython|recipe" build.log 2>/dev/null | tail -50 || echo "(에러 라인 없음)"
            echo '```'
            echo '### build.log 마지막 120줄'
            echo '```'
            tail -120 build.log 2>/dev/null || echo "(build.log 없음)"
            echo '```'
          } > issue_body.md
          gh issue create --title "빌드 로그 $(date +%H%M)" --body-file issue_body.md 2>&1 || \
            gh issue comment 1 --body-file issue_body.md 2>&1 || \
            echo "Issue 전송 실패"

      - name: 빌드 로그 업로드 (아티팩트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
