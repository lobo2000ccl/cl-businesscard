name: Build Android APK

# 수동 실행 또는 코드 푸시 시 자동 빌드
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # GitHub 웹에서 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시스템 패키지 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential \
            libltdl-dev

      - name: Buildozer 및 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Buildozer 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: APK 빌드
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: APK 파일 찾아서 모으기
        run: |
          mkdir -p apk_out
          echo "=== 전체 APK 검색 ==="
          find / -name "*.apk" -not -path "*/.buildozer/android/platform/*" 2>/dev/null | tee apk_list.txt
          # 찾은 APK 전부 apk_out으로 복사
          while read -r f; do
            [ -f "$f" ] && cp "$f" apk_out/ && echo "복사: $f"
          done < apk_list.txt
          echo "=== apk_out 내용 ==="
          ls -lh apk_out/ || echo "APK 없음"
          # 빌드 로그 마지막 50줄 출력 (실패 원인 확인용)
          echo "=== build.log 마지막 60줄 ==="
          tail -60 build.log 2>/dev/null || true

      - name: APK 업로드 (다운로드 가능)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CL-BusinessCard-APK
          path: apk_out/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 빌드 로그를 저장소에 커밋 (디버깅용)
        if: always()
        run: |
          # 로그 마지막 300줄만 저장소에 push (Claude가 읽을 수 있도록)
          mkdir -p _buildlogs
          tail -300 build.log > _buildlogs/last_build.log 2>/dev/null || echo "no build.log" > _buildlogs/last_build.log
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f _buildlogs/last_build.log
          git commit -m "ci: 빌드 로그 저장 [skip ci]" || echo "변경 없음"
          git push origin main || echo "push 실패"

      - name: 빌드 로그 업로드 (아티팩트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
